<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up - Tiny World Builder</title>
  <link rel="icon" href="assets/twlogo.png" />
  <script>
    window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY ||
      localStorage.getItem('CLERK_PUBLISHABLE_KEY') ||
      sessionStorage.getItem('CLERK_PUBLISHABLE_KEY');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      padding: 48px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .button {
      display: inline-block;
      padding: 12px 32px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      margin: 8px;
    }
    .button:hover {
      background: #5568d3;
    }
    .divider {
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }
    .link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover {
      text-decoration: underline;
    }
    .error {
      padding: 12px;
      background: #fee;
      color: #d32f2f;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .loading {
      display: none;
      padding: 20px;
      color: #666;
    }
    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign Up</h1>
    <p>Create your Tiny World Builder account</p>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">Redirecting to sign up...</div>

    <div id="signup-form">
      <p>Join to start building</p>
      <button class="button" id="signup-btn">Sign Up with Clerk</button>
    </div>

    <div class="divider">or</div>

    <p>
      Already have an account? <a class="link" href="/sign-in.html">Sign in</a>
    </p>
  </div>

  <script>
    (function() {
      const signupBtn = document.getElementById('signup-btn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const form = document.getElementById('signup-form');

      function showError(msg) {
        error.textContent = msg;
        error.classList.add('show');
        loading.classList.remove('show');
        signupBtn.disabled = false;
      }

      function showLoading() {
        error.classList.remove('show');
        loading.classList.add('show');
        form.style.display = 'none';
        signupBtn.disabled = true;
      }

      signupBtn.addEventListener('click', () => {
        showLoading();

        const publishableKey = window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY;

        if (!publishableKey) {
          showError('Clerk not configured. Using test login...');
          setTimeout(() => {
            const testToken = 'test-token-clerk-user-' + Date.now();
            sessionStorage.setItem('clerk-session-token', testToken);
            window.location.href = '/tiny-world-builder.html';
          }, 1500);
          return;
        }

        try {
          console.log('[SignUp] Redirecting to Clerk...');

          const parts = publishableKey.split('_');
          const encoded = parts[parts.length - 1];

          if (!encoded) {
            throw new Error('Invalid Clerk key format');
          }

          const decoded = atob(encoded);
          const domain = decoded.replace(/\$.*/, '').trim();

          if (!domain) {
            throw new Error('Could not extract domain from Clerk key');
          }

          const redirectUrl = window.location.origin + '/tiny-world-builder.html';
          const signUpUrl = `https://${domain}/sign-up?redirect_url=${encodeURIComponent(redirectUrl)}`;

          console.log('[SignUp] Redirecting to:', signUpUrl);
          window.location.href = signUpUrl;
        } catch (err) {
          showError('Sign up error: ' + err.message);
        }
      });
    })();
  </script>
</body>
</html>
