<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="TinyWorld admin user management." />
<title>Admin Users - Tiny World Builder</title>
<link rel="icon" href="assets/twlogo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" />
<link rel="stylesheet" href="styles/landing.css" />
<script>
  (function adminAuthBootstrap() {
    // Set Clerk publishable key from environment or inline config
    if (!window.__CLERK_PUBLISHABLE_KEY) {
      const publishableKey = (function () {
        try {
          const url = new URL(window.location.href);
          return url.searchParams.get('clerk_key') || localStorage.getItem('clerk_publishable_key') || '';
        } catch (_) {
          return '';
        }
      })();
      if (publishableKey) {
        window.__CLERK_PUBLISHABLE_KEY = publishableKey;
      }
    }

    window.__tinyworldAuthReady = new Promise(function (resolve) {
      window.__resolveTinyWorldAuthReady = resolve;
      setTimeout(function () { resolve(false); }, 5000);
    });
  })();
</script>
<script type="module" src="vendor/tinyworld-auth.js"></script>
</head>
<body class="landing-page admin-users-page">
  <!-- Clerk Auth Modal -->
  <div id="clerk-auth-container" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10000;font-family:system-ui,-apple-system,sans-serif">
    <div id="clerk-auth-modal" style="background:white;border-radius:12px;padding:48px;box-shadow:0 10px 40px rgba(0,0,0,0.2);max-width:420px;width:90%;text-align:center">
      <h1 style="margin:0 0 24px;font-size:28px;font-weight:700">Sign in</h1>
      <div id="clerk-sign-in-root" style="min-height:300px;display:flex;align-items:center;justify-content:center">
        <div style="color:#666;font-size:14px">
          <p>Initializing...</p>
        </div>
      </div>
    </div>
  </div>

  <header class="site-header" aria-label="Tiny World Builder">
    <a class="site-logo" href="/" aria-label="Tiny World Builder home">
      <img src="assets/twlogo-wordmark.png" alt="Tiny World Builder" width="1064" height="403" />
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/worlds">Worlds</a>
      <a href="/community">Community</a>
      <a href="/news">News</a>
      <a href="/tiny-world-builder">Builder</a>
      <a href="/admin-users" aria-current="page">Admin</a>
    </nav>
  </header>

  <main>
    <section class="page-hero-section admin-users-hero" aria-labelledby="admin-users-title">
      <div class="page-hero-copy">
        <p class="eyebrow">God-admin only</p>
        <h1 id="admin-users-title">User access</h1>
        <p>Search accounts, edit profile fields, reset Identity passwords, and enable Tinyverse lobby/multiplayer access.</p>
      </div>
    </section>

    <section class="admin-users-shell" aria-label="User administration">
      <div class="admin-users-toolbar">
        <label>
          <span>Search users</span>
          <input id="admin-user-search" type="search" placeholder="email, username, X, GitHub, display name" autocomplete="off" />
        </label>
        <button class="primary-action" id="admin-user-search-btn" type="button">Search</button>
        <button class="secondary-action" id="admin-user-refresh-btn" type="button">Refresh</button>
      </div>
      <p class="admin-users-status" id="admin-users-status">Checking admin access…</p>
      <div class="admin-users-layout">
        <div class="admin-users-list-wrap">
          <table class="admin-users-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Socials</th>
                <th>Lobby</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="admin-users-list"></tbody>
          </table>
        </div>
        <form class="admin-user-editor" id="admin-user-editor" hidden>
          <div class="admin-user-editor-head">
            <h2>Edit account</h2>
            <span id="admin-user-id-pill"></span>
          </div>
          <input id="admin-user-id" type="hidden" />
          <label>Username<input id="admin-user-username" type="text" autocomplete="off" required /></label>
          <label>Email<input id="admin-user-email" type="email" autocomplete="off" /></label>
          <label>Display name<input id="admin-user-display" type="text" autocomplete="off" required /></label>
          <label>X handle<input id="admin-user-twitter" type="text" autocomplete="off" placeholder="jasonkneen" /></label>
          <label>GitHub handle<input id="admin-user-github" type="text" autocomplete="off" placeholder="jasonkneen" /></label>
          <label>Avatar/image URL<input id="admin-user-image" type="url" autocomplete="off" /></label>
          <label>About<textarea id="admin-user-about" rows="5"></textarea></label>
          <label class="admin-user-check"><input id="admin-user-lobby" type="checkbox" /> Enable Tinyverse lobby + multiplayer access</label>
          <p class="admin-reset-note" id="admin-reset-note"></p>
          <div class="admin-user-actions">
            <button class="primary-action" type="submit">Save account</button>
            <button class="secondary-action" id="admin-user-reset-password" type="button">Reset password</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="scripts/admin-users.js" defer></script>
</body>
</html>
