<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      padding: 48px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 24px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      color: #666;
      font-size: 14px;
      margin-top: 24px;
    }
    .error {
      color: #d32f2f;
      padding: 12px;
      background: #fee;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Signing In</h1>
    <div class="spinner"></div>
    <p id="status">Completing your sign in...</p>
    <div class="error" id="error"></div>
  </div>

  <script>
    (async function() {
      try {
        console.log('[OAuth Callback] Processing OAuth response...');

        // Get auth code from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const provider = sessionStorage.getItem('oauth_provider') || 'oauth';
        const error = params.get('error');

        console.log('[OAuth Callback] Provider from sessionStorage:', provider);

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');

        if (error) {
          console.error('[OAuth Callback] Error from provider:', error);
          errorEl.textContent = `Sign in failed: ${error}`;
          errorEl.classList.add('show');
          statusEl.style.display = 'none';
          return;
        }

        if (!code) {
          console.error('[OAuth Callback] No authorization code received');
          errorEl.textContent = 'No authorization code received. Please try again.';
          errorEl.classList.add('show');
          statusEl.style.display = 'none';
          return;
        }

        console.log('[OAuth Callback] Authorization code:', code.substring(0, 20) + '...');
        console.log('[OAuth Callback] Provider:', provider);

        // Exchange code for token via our backend
        console.log('[OAuth Callback] Exchanging code with backend...');
        const exchangeResponse = await fetch('/api/oauth/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            code,
            state,
            provider
          })
        });

        console.log('[OAuth Callback] Exchange response status:', exchangeResponse.status);

        if (!exchangeResponse.ok) {
          const errorText = await exchangeResponse.text();
          console.error('[OAuth Callback] Exchange failed, response:', errorText);
          const error = (() => {
            try { return JSON.parse(errorText); } catch (e) { return { error: errorText }; }
          })();
          throw new Error(error.error || error.message || `Token exchange failed: ${exchangeResponse.status}`);
        }

        const response = await exchangeResponse.json();
        console.log('[OAuth Callback] ✓ Exchange successful');
        console.log('[OAuth Callback] Response keys:', Object.keys(response));

        const { token, user } = response;
        console.log('[OAuth Callback] ✓ Token received for user:', user?.email);
        console.log('[OAuth Callback] Token length:', token?.length);
        console.log('[OAuth Callback] User data:', JSON.stringify(user));

        // Store token and user
        localStorage.setItem('tinyworld:user', JSON.stringify(user));
        localStorage.setItem('clerk-session-token', token);
        sessionStorage.setItem('clerk-session-token', token);

        statusEl.textContent = `Welcome, ${user.email}!`;

        // Redirect to builder after a brief pause
        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/tiny-world-builder';
          window.location.href = redirect;
        }, 1500);

      } catch (err) {
        console.error('[OAuth Callback] Error:', err);
        const errorEl = document.getElementById('error');
        const statusEl = document.getElementById('status');
        errorEl.textContent = err.message || 'Sign in failed. Please try again.';
        errorEl.classList.add('show');
        statusEl.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
