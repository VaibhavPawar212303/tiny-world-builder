<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - Tiny World Builder</title>
  <link rel="icon" href="assets/twlogo.png" />
  <script>
    // Clerk publishable key - set directly as fallback
    const CLERK_KEY = 'pk_test_Y2hhcm1lZC1yZWRiaXJkLTIzLmNsZXJrLmFjY291bnRzLmRldiQ';

    // Try to get Clerk key from multiple sources
    window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY =
      window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY ||
      localStorage.getItem('CLERK_PUBLISHABLE_KEY') ||
      sessionStorage.getItem('CLERK_PUBLISHABLE_KEY') ||
      CLERK_KEY; // Direct fallback

    console.log('[SignIn] Clerk key configured:', window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY ? '✓' : '✗');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      padding: 48px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .button {
      display: inline-block;
      padding: 12px 32px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      margin: 8px;
    }
    .button:hover {
      background: #5568d3;
    }
    .divider {
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }
    .link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover {
      text-decoration: underline;
    }
    .error {
      padding: 12px;
      background: #fee;
      color: #d32f2f;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .loading {
      display: none;
      padding: 20px;
      color: #666;
    }
    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign In</h1>
    <p>Welcome back to Tiny World Builder</p>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">Redirecting to sign in...</div>

    <div id="signin-form">
      <p>Sign in to your account</p>
      <button class="button" id="signin-btn">Sign In with Clerk</button>
    </div>

    <div class="divider">or</div>

    <p>
      Don't have an account? <a class="link" href="/sign-up.html">Sign up</a>
    </p>
  </div>

  <script>
    (function() {
      const signinBtn = document.getElementById('signin-btn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const form = document.getElementById('signin-form');

      function showError(msg) {
        error.textContent = msg;
        error.classList.add('show');
        loading.classList.remove('show');
        signinBtn.disabled = false;
      }

      function showLoading() {
        error.classList.remove('show');
        loading.classList.add('show');
        form.style.display = 'none';
        signinBtn.disabled = true;
      }

      signinBtn.addEventListener('click', () => {
        showLoading();
        console.log('[SignIn] Demo mode: Creating test account...');

        // Demo/test mode: Create a test account and session
        // In production, this would connect to your backend API
        setTimeout(() => {
          const userId = 'user_' + Date.now();
          const testUser = {
            id: userId,
            email: 'demo@tinyworld.local',
            created_at: new Date().toISOString()
          };

          // Use the correct test token format that the backend expects
          const testToken = 'test-token-' + userId;

          // Store in localStorage for persistence
          localStorage.setItem('tinyworld:user', JSON.stringify(testUser));
          localStorage.setItem('tinyworld:auth_token', testToken);

          console.log('[SignIn] ✓ Test account created:', testUser.email);

          // Redirect to builder
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/tiny-world-builder';
          window.location.href = redirect;
        }, 1000);
      });
    })();
  </script>
</body>
</html>
