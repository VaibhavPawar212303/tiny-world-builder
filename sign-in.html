<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - Tiny World Builder</title>
  <link rel="icon" href="assets/twlogo.png" />
  <script>
    // Clerk publishable key - set directly as fallback
    const CLERK_KEY = 'pk_test_Y2hhcm1lZC1yZWRiaXJkLTIzLmNsZXJrLmFjY291bnRzLmRldiQ';

    // Try to get Clerk key from multiple sources
    window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY =
      window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY ||
      localStorage.getItem('CLERK_PUBLISHABLE_KEY') ||
      sessionStorage.getItem('CLERK_PUBLISHABLE_KEY') ||
      CLERK_KEY; // Direct fallback

    console.log('[SignIn] Clerk key configured:', window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY ? '✓' : '✗');
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      padding: 48px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .button {
      display: inline-block;
      padding: 12px 32px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      margin: 8px;
    }
    .button:hover {
      background: #5568d3;
    }
    .divider {
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }
    .link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover {
      text-decoration: underline;
    }
    .error {
      padding: 12px;
      background: #fee;
      color: #d32f2f;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .loading {
      display: none;
      padding: 20px;
      color: #666;
    }
    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign In</h1>
    <p>Welcome back to Tiny World Builder</p>

    <div class="error" id="error"></div>
    <div class="loading" id="loading">Redirecting to sign in...</div>

    <div id="signin-form">
      <p>Sign in with your social account</p>
      <button class="button" id="google-btn" style="background: #4285f4; margin-bottom: 12px; width: 100%;">
        <span style="margin-right: 8px;">🔵</span> Sign in with Google
      </button>
      <button class="button" id="github-btn" style="background: #333; margin-bottom: 12px; width: 100%;">
        <span style="margin-right: 8px;">⚫</span> Sign in with GitHub
      </button>
    </div>

    <div class="divider">or</div>

    <p>
      Don't have an account? <a class="link" href="/sign-up.html">Sign up</a>
    </p>
  </div>

  <script>
    (function() {
      const googleBtn = document.getElementById('google-btn');
      const githubBtn = document.getElementById('github-btn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const form = document.getElementById('signin-form');

      // OAuth Client ID from Clerk Dashboard
      const oauthClientId = 'lIdrbFqcu0TXAMji';

      // Get Clerk instance from publishable key
      const publishableKey = window.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY;
      if (!publishableKey) {
        error.textContent = 'Clerk is not configured';
        error.classList.add('show');
        form.style.display = 'none';
        return;
      }

      function getClerkInstance() {
        try {
          const parts = publishableKey.split('_');
          const encoded = parts[parts.length - 1];
          const decoded = atob(encoded);
          return decoded.replace(/\$.*/, '').trim();
        } catch (err) {
          console.error('[OAuth] Failed to extract instance:', err);
          return null;
        }
      }

      const clerkInstance = getClerkInstance();
      console.log('[OAuth] Clerk instance:', clerkInstance);
      console.log('[OAuth] Client ID:', oauthClientId);

      function showError(msg) {
        error.textContent = msg;
        error.classList.add('show');
        loading.classList.remove('show');
        form.style.display = '';
        googleBtn.disabled = false;
        githubBtn.disabled = false;
      }

      function showLoading(msg) {
        error.classList.remove('show');
        loading.textContent = msg || 'Redirecting to sign in...';
        loading.classList.add('show');
        form.style.display = 'none';
        googleBtn.disabled = true;
        githubBtn.disabled = true;
      }

      function initiateOAuth(provider) {
        showLoading(`Connecting to ${provider}...`);
        console.log('[OAuth] Starting', provider, 'OAuth flow');

        if (!clerkInstance) {
          showError('Cannot connect to Clerk. Please try again.');
          return;
        }

        // Clerk OAuth authorization URL
        const redirectUrl = window.location.origin + '/oauth-callback.html';

        // Store provider in sessionStorage to retrieve it after OAuth redirect
        sessionStorage.setItem('oauth_provider', provider);

        const oauthUrl = `https://${clerkInstance}/oauth/authorize?` +
          new URLSearchParams({
            client_id: oauthClientId,
            redirect_uri: redirectUrl,
            response_type: 'code',
            scope: 'openid profile email',
            provider: provider
          }).toString();

        console.log('[OAuth] Redirecting to:', oauthUrl);
        window.location.href = oauthUrl;
      }

      googleBtn.addEventListener('click', () => initiateOAuth('google'));
      githubBtn.addEventListener('click', () => initiateOAuth('github'));
    })();
  </script>
</body>
</html>
